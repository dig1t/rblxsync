name: Release

# Bumping the version in the VERSION file and pushing it to main cuts a release:
# the version is synced into Cargo.toml/Cargo.lock, committed, tagged `v<version>`,
# and prebuilt binaries for Linux, macOS, and Windows are attached to the release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['VERSION']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Sync version into Cargo.toml and Cargo.lock
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # First `version = "..."` line is the [package] version.
          perl -0pi -e 's/^version = "[^"]*"/version = "$ENV{VERSION}"/m' Cargo.toml
          # The version line directly after the rblxsync lockfile entry.
          perl -0pi -e 's/(^name = "rblxsync"\n)version = "[^"]*"/$1version = "$ENV{VERSION}"/m' Cargo.lock

      - name: Commit version bump
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cargo.toml/Cargo.lock already at v$VERSION"
          else
            git add Cargo.toml Cargo.lock
            git commit -m "Release v$VERSION"
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable branch, pinned 2026-06-12
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="rblxsync-v$VERSION-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/rblxsync" "$dir/"
          cp README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          dir="rblxsync-v$VERSION-$TARGET"
          mkdir "$dir"
          cp "target/$TARGET/release/rblxsync.exe" "$dir/"
          cp README.md LICENSE "$dir/"
          7z a "$dir.zip" "$dir"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rblxsync-${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          generate_release_notes: true
          files: dist/*
