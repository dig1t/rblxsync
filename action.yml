name: 'rblxsync'
description: 'Sync your game passes, developer products, badges, and places from one YAML file'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  api_key:
    description: 'Your Roblox Open Cloud API key. Store it as a repository secret.'
    required: true
  command:
    description: 'Which command to run: run, publish, validate, or export'
    required: false
    default: 'run'
  config:
    description: 'Path to your config file'
    required: false
    default: 'rblxsync.yml'
  args:
    description: 'Extra flags, such as --dry-run. Split on spaces, so no quoting.'
    required: false
    default: ''
  roblox_cookie:
    description: 'Your .ROBLOSECURITY cookie. Only needed when changing universe settings.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Checkout rblxsync
      uses: actions/checkout@v7
      with:
        repository: dig1t/rblxsync
        # Build the same ref the caller pinned in `uses: dig1t/rblxsync@<ref>`.
        # Without this, every run builds the default branch and the pin only
        # applies to this file. Empty (local `uses: ./`) falls back to default.
        ref: ${{ github.action_ref }}
        path: .rblxsync-action

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          .rblxsync-action/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('.rblxsync-action/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build rblxsync
      shell: bash
      working-directory: .rblxsync-action
      run: cargo build --release

    - name: Run rblxsync
      shell: bash
      env:
        ROBLOX_API_KEY: ${{ inputs.api_key }}
        ROBLOX_COOKIE: ${{ inputs.roblox_cookie }}
        COMMAND: ${{ inputs.command }}
        CONFIG: ${{ inputs.config }}
        # ARGS is intentionally left unquoted below so multiple flags
        # (e.g. "--dry-run --foo") word-split into separate arguments.
        ARGS: ${{ inputs.args }}
      run: |
        .rblxsync-action/target/release/rblxsync "$COMMAND" --config "$CONFIG" $ARGS

