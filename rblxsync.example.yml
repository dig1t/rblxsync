# Everything here is optional except universe.id.
# Delete the parts you don't need.

universe:
  id: 123456789 # required: find it in your Creator Hub URL, or run print(game.GameId) in Studio
  name: "My Awesome Game"
  description: "Updated via rblxsync!"
  genre: "adventure" # saved locally only, never sent to Roblox
  playable_devices: ["computer", "phone", "tablet"] # computer, phone, tablet, console, vr
  max_players: 50 # saved locally only, never sent to Roblox
  private_server_cost: "disabled" # "disabled" to turn them off, 0 for free, or a Robux price

# Heads up: setting anything above besides id means you also need
# ROBLOX_COOKIE in your .env file. See the docs for why.

game_passes:
  - name: "VIP Pass"
    description: "Fly, glow, and skip the queue"
    price: 100
    icon: "vip.png"
    is_for_sale: true

developer_products:
  - name: "Speed Boost"
    description: "Move twice as fast for five minutes"
    price: 50 # required for products, unlike game passes
    icon: "boost.png"
    is_active: true # read but ignored, does nothing right now

badges:
  - name: "First Win"
    description: "Won your first round"
    icon: "first_win.png"
    is_enabled: true

places:
  - place_id: 1234567890
    file_path: "places/start_place.rbxl"
    publish: true # only places set to true get published
  - place_id: 1234567891
    name: "Arena" # the root place's name is the game's, so set that one in universe: instead
    server_size: 12 # most players in one server

# A dev copy of the game: `rblxsync run --env dev` syncs the entries above to
# it. Each entry keeps its id there under `ids: { dev: ... }`, which rblxsync
# writes for you. Anything set here replaces the top-level value for dev only;
# null leaves that field alone in the dev copy.
environments:
  dev:
    universe:
      id: 987654321 # required, and not the live game's
      name: null # keep the dev copy's own name
    output_path: "src/shared/ConfigDev.luau"
    name_prefix: "[dev] " # "Arena" is "[dev] Arena" in the dev copy

thumbnails:
  game_page: # the top of your game's page, up to 10, in this order
    - image: "thumbnails/lobby.png"
      alt_text: "Players gathered in the lobby before a round"
    - image: "thumbnails/arena.png"
  home_page: # home page tiles, up to 5; two or more turn on personalization
    - image: "thumbnails/home_a.png"
    - image: "thumbnails/home_b.png"

assets_dir: assets/icons/ # where the icon and thumbnail files above live

# Who pays for a new badge once the game's 5 free a day are used: "user" or "group"
# (paid badges also need `rblxsync run --allow-paid-badges`)
badge_payment_source: "user"

# rblxsync writes every ID into this file after each run, so your
# game code can require it instead of hardcoding numbers
output_path: "src/shared/Config.luau"

# creator is only needed if you upload icons
creator:
  id: "12345678" # your user ID or group ID
  type: "user" # "user" or "group"
