# rblxsync.yml: annotated template.
# Only `universe.id` is required. Delete any section you don't need and start small.
# Full schema: references/config-schema.md

# Directory holding icon and thumbnail files referenced below (default: "assets").
assets_dir: assets/icons/

# Wallet a NEW badge is paid from once the game's 5 free badges a day are used: "user" or "group".
# Only needed if you create badges. Paid badges also need `run --allow-paid-badges`.
badge_payment_source: "user"

# If set, every successful `rblxsync run` regenerates a typed Luau module here.
# Point this at a Rojo-synced path so game code can require it.
output_path: "src/shared/Config.luau"

universe:
  id: 123456789                                  # Universe ID (required), NOT a place ID
  # Genre is not synced: set it in the Creator Hub (changeable once every 3 months).
  name: "My Awesome Game"                        # root place's name
  description: "Updated via rblxsync!"           # root place's description
  playable_devices: ["computer", "phone", "tablet"]  # computer | phone | tablet | console | vr
  max_players: 50                                # root place's server size
  private_server_cost: "disabled"               # "disabled" | 0 (free) | 100 (Robux)

game_passes:
  - name: "VIP Pass"                # match key (case-insensitive) until `id` is set; then just a label
    id: 111222333                   # written back automatically on the first run; with it set, renames are safe
    ids: { dev: 444555666 }         # the same pass in environments.dev; written back by `run --env dev`
    description: "Exclusive access and perks"
    price: 100
    icon: "vip.png"                 # relative to assets_dir
    is_for_sale: true               # synced

developer_products:
  - name: "Speed Boost"
    description: "Double speed for 5 minutes"
    price: 50                       # REQUIRED for developer products
    icon: "boost.png"
    is_active: true                 # parsed but NOT synced; has no effect today

badges:
  - name: "First Win"               # a NEW badge is free 5 a day, then 100 Robux
    description: "Awarded for your first victory!"
    icon: "first_win.png"
    is_enabled: true

places:
  - place_id: 1234567890
    file_path: "places/start_place.rbxl"
    publish: true                   # only published by `rblxsync publish` when true
  - place_id: 1234567891
    ids: { dev: 1234567892 }        # the same place in environments.dev (places can't be created; add by hand)
    name: "Arena"                   # synced (API key); the ROOT place's name is the experience's: set it in universe: instead
    server_size: 12                 # max players per server; synced

# Other copies of the game (dev, staging). `rblxsync <cmd> --env dev` uses the
# top level with this laid over it; null clears an inherited field. Entries are
# shared: each keeps its id per copy under `ids:`. Lock file: rblxsync-lock.dev.yml.
environments:
  dev:
    universe:
      id: 987654321                 # REQUIRED, must differ from the top level
      name: null                    # don't rename the dev copy
    output_path: "src/shared/ConfigDev.luau"  # omit to write the same file (sync-per-build setups)
    name_prefix: "[dev] "           # prefixes the experience + place names in this copy, never item names

# A missing or empty list leaves that set alone on Roblox.
# game_page isn't supported: an API key can only change translated game page sets.
thumbnails:
  home_page:                        # home page tiles: up to 5; 2+ turn on personalization (no alt_text)
    - image: "thumbnails/home_a.png" # relative to assets_dir; re-uploaded only when the file changes
    - image: "thumbnails/home_b.png"
